[package]
name = "backup-assistant"
version = "1.1.39"
description = "Incremental backup desktop assistant"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "Backy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 显式启用 Tauri 的 schemars 依赖所需的标准库，避免自动探测失败。
indexmap = { version = "1.9.3", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
base64 = "0.22"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
# 与构建依赖保持一致，避免依赖图拆分后丢失 std 特性。
indexmap = { version = "1.9.3", features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
